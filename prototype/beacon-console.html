<style>

.table { width:100%; border-collapse:collapse; font-size:13px; line-height:19px; }

.table td { padding:var(--space-2) var(--space-3); border-bottom:1px solid var(--line); vertical-align:top; }
.table tr:last-child td { border-bottom:0; }
