<!doctype html>
<html><head><meta charset="utf-8"><title>ApprovalCard</title></head>
<body>
<div id="root"></div>
<script>
  var B = window.Beacon;
  document.getElementById('root').appendChild(B.ApprovalCard({

    action: 'run logrotate --force /etc/logrotate.d/nginx on web-01',
    blastRadius: 'Rotates the access log now. nginx keeps serving; about 3 GB is compressed and old files are removed.',
    canApprove: true, approveLabel: 'Approve rotation'
  }));
</script>
</body></html>
