<!doctype html>
<html><head><meta charset="utf-8"><title>SeverityChip</title></head>
<body>
<div id="root" class="bc-row"></div>
<script>
  var B = window.Beacon, r = document.getElementById('root');
  ['critical','warning','info','ok'].forEach(function (s) { r.appendChild(B.SeverityChip({ severity: s })); });
</script>
</body></html>
